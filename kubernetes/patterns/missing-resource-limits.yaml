apiVersion: kubepattern.dev/v1
kind: Pattern
metadata:
  name: missing-resource-limits
  labels:
    kubepattern.dev/platform: kubernetes
    kubepattern.dev/family: single
  annotations:
    kubepattern.dev/summary: "A Deployment whose containers set no resource limits, so one of them can starve the others on its node."
spec:
  displayName: "Missing Resource Limits"
  category: "Reliability"
  severity: "HIGH"
  message: "Deployment {{target.metadata.namespace}}/{{target.metadata.name}} sets no resource limits on its containers."
  
  target:
    kind: Deployment
    apiVersion: apps/v1
    plural: deployments
    filters:
      matchNone:
        - path: "spec.template.spec.containers[*].resources.limits"
          operator: EXISTS
